name: Kompas checks
# Checks Kompas data links and re-runs the test personas after every change to the app or its data.
on:
  push:
    branches: [main]
    paths: ['kompas/**', '.github/workflows/kompas-tests.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node kompas/tests/run.mjs
      - run: node kompas/tests/liceum.mjs
