<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🔒</title>
<style>
:root{--ink:#14161b;--muted:#5b6170;--line:#e3e5ea;--red:#d7263d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:16px}
.box{width:100%;max-width:340px;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--red);margin:0 auto 20px;box-shadow:0 0 0 7px rgba(215,38,61,.12)}
h1{font:700 22px/1.3 Georgia,serif;margin:0 0 6px}
p{color:var(--muted);margin:0 0 22px;font-size:15px;line-height:1.5}
input{width:100%;font:600 28px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.4em;text-align:center;padding:14px 10px 14px calc(10px + .4em);border:1.5px solid var(--line);border-radius:12px;outline:none}
input:focus{border-color:var(--ink)}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 16px/1 system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.err{color:var(--red);min-height:22px;margin-top:12px;font-size:14px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>

  var f=document.getElementById('f'),inp=document.getElementById('pin'),btn=document.getElementById('go'),err=document.getElementById('err'),fails=0;
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  async function unlock(pin){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    return new TextDecoder().decode(pt);
  }
  function show(html,pin){
    try{sessionStorage.setItem('ion-pin',pin)}catch(e){}
    document.open();document.write(html);document.close();
  }
  if(!window.crypto||!crypto.subtle){err.textContent='Ta strona wymaga HTTPS · This page needs HTTPS.';btn.disabled=true;return}
  var saved=null;try{saved=sessionStorage.getItem('ion-pin')}catch(e){}
  if(saved){unlock(saved).then(function(h){show(h,saved)}).catch(function(){try{sessionStorage.removeItem('ion-pin')}catch(e){}})}
  f.addEventListener('submit',async function(e){
    e.preventDefault();var pin=inp.value.trim();if(!pin)return;
    btn.disabled=true;btn.textContent='Sprawdzam… · Checking…';err.textContent='';
    try{var html=await unlock(pin);show(html,pin)}
    catch(x){
      fails++;await new Promise(function(r){setTimeout(r,Math.min(5000,fails*600))});
      btn.disabled=false;btn.textContent='Otwórz · Open';err.textContent='Zły PIN · Wrong PIN';
