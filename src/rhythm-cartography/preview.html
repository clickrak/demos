  <div class="text">
    <div class="kicker">1973 &mdash; 2026 &middot; 33 GENRES</div>
    <h1>RHYTHM<span>CARTOGRAPHY</span></h1>
    <p>50 years of electronic music,<br>mapped and playable.</p>
    <div class="card">
      <div class="label">RHYTHM DNA &middot; CHICAGO HOUSE &middot; 120 BPM</div>
      <div class="rows" id="rows"></div>
    </div>
  </div>
  <script>
    // Chicago House pattern from the app (16 steps per row), playhead on step 5.
    const rows = [["KICK", "1000100010001000"], ["SNARE", "0000100000001000"], ["HI-HAT", "1111111111111111"],
                  ["OPEN HAT", "0010001000100010"], ["BASS", "0010001000100010"]];
    const head = 4, box = document.getElementById("rows");
    for (const [name, p] of rows) {
      const label = document.createElement("span"); label.textContent = name; box.appendChild(label);
      const steps = document.createElement("div"); steps.className = "steps";
      [...p].forEach((c, s) => {
        const i = document.createElement("i");
        if (c !== "0") i.style.background = s === head ? "#fff" : "#FFB03A";
        else if (s % 4 === 0) i.style.background = "#232948";
        if (s === head && c === "0") i.style.outline = "1px solid #ffffff33";
        steps.appendChild(i);
      });
      box.appendChild(steps);
    }
  </script>
