<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:627px;overflow:hidden}
  body{display:grid;grid-template-columns:640px 560px;font-family:Inter,sans-serif;background:#fff;color:#14161b}
  .l{padding:64px 56px 0 64px;position:relative}
  .k{font:600 15px/1 'DejaVu Sans Mono',monospace;letter-spacing:.14em;color:#d7263d;text-transform:uppercase}

  .r{position:relative;background:radial-gradient(ellipse at 50% 50%,#1b1440 0,#06070b 68%);overflow:hidden}

  .ion{width:18px;height:18px;border-radius:50%;background:#ede9fe;box-shadow:0 0 16px 6px #8b5cf6,0 0 60px 22px rgba(139,92,246,.45)}
  .beam{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;background:linear-gradient(90deg,rgba(139,92,246,0),rgba(139,92,246,.35),rgba(139,92,246,0))}
  .cap{position:absolute;left:28px;bottom:26px;font:500 15px/1 'DejaVu Sans Mono',monospace;color:#9aa1b2;letter-spacing:.06em}
</style></head><body>
<div class="l">
  <div class="k">MIKOK · Warszawa</div>

  <div class="pill"><span>PL / EN</span><span>interaktywne</span></div>
</div>
<div class="r">

  <div class="el" style="right:-40px;bottom:-40px;border-color:rgba(239,68,68,.5)"></div>
  <div class="el" style="right:-40px;top:-40px;border-color:rgba(59,130,246,.5)"></div>

</div>
