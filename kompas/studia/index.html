<!doctype html>
<html lang="pl">

<body>
  <header class="top">
    <a class="brand" href="#/start"><svg class="bcomp" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><g class="bneedle"><path class="bn-n" d="M12 4.5 14.6 12H9.4Z"/><path class="bn-s" d="M12 19.5 9.4 12h5.2Z"/></g></svg>Kompas <span>Studia</span></a>
    <nav class="chapters" aria-label="Rozdziały">
      <button data-go="pewnosc" data-ch="ja">Ja</button><button data-go="sily" data-ch="swiat">Świat</button><button data-go="dlugosc" data-ch="droga">Droga</button><button data-go="kompas" data-ch="wyniki">Wyniki</button>
    </nav>
    <button class="savebtn" data-export="download" title="Pobierz plik z odpowiedziami, żeby wrócić później"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><span>Zapisz</span></button>

  <main id="app" tabindex="-1"><p class="loading">Ładuję…</p></main>

    <p id="fmsg" role="status"></p>
    <p class="ver">Kompas Studia v0.96 · wersja testowa</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
